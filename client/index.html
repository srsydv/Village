<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070B14" />
    <meta
      name="description"
      content="Safar is your private AI travel concierge — destinations, budgets, hotels, and day-by-day plans before you fly."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Safar" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <base href="/" />
    <title>Safar — Travel Concierge</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style>
      html, body { margin: 0; background: #070b14; color: #f6efe4; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function (message) {
        var root = document.getElementById("root");
        if (!root || root.childElementCount > 0) return;
        root.textContent = String(message || "Safar could not start.");
      };
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
